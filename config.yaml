# Football Predictor — Configuration
# All model hyperparameters, file paths, and runtime settings in one place.
# Override any value via environment variable: FOOTBALL_PREDICTOR__<KEY>
#
# Usage:
#   from src.config import load_config
#   cfg = load_config()
#   print(cfg.model.elo_k)

model:
  # Dixon-Coles time decay (xi). 0.0018/day ~= 55% weight after 1 year.
  # Calibrated to 0.0035 by scripts/calibrate_model.py (walk-forward OOS EPL).
  dc_xi: 0.0035

  # Dixon-Coles hierarchical shrinkage toward the league mean (small-sample fix
  # for newly promoted / newly created teams): adds a ridge penalty of
  #   dc_shrinkage * (attack^2 + defense^2)
  # to the negative log-likelihood. 0 disables it (keeps the classical fit).
  # Calibrated to 0.05 by scripts/calibrate_model.py.
  dc_shrinkage: 0.05

  # Elo parameters
  elo_k: 20.0               # Update speed; higher = more reactive
  elo_home_advantage: 75.0  # Elo points added to home team
  elo_initial_rating: 1500.0
  elo_goal_diff_multiplier: true
  elo_draw_width: 0.44      # Heuristic; run scripts/calibrate_elo_draw.py for data-driven fit

  # Dynamic state-space (Kalman-filtered) team strength — replaces the
  # static-window Dixon-Coles fit as the primary Poisson model. Each team's
  # attack/defense evolves as a latent random walk with process-noise variance
  # ss_q (per match), filtered with an extended Kalman filter so every rating
  # uses strictly prior matches (leak-free by construction).
  ss_q: 0.01                # Random-walk variance per match on goal-log-rate
  ss_q_xg: 0.01             # Lower process noise when filtering on xG (cleaner obs)
                            # Calibrated from 0.005 -> 0.01 by calibrate_model.py
  ss_prior_var: 0.25        # Initial state variance on team strength
  ss_obs_var_scale_xg: 0.5  # Measurement-noise scale when observing xG (goals use 1.0)

  # Meta-learner (logistic regression)
  meta_max_iter: 2000
  meta_C: 0.5               # Inverse regularization strength (calibrated from 1.0)

  # Market-residual meta-model: when odds columns are present, the closing
  # implied probabilities (and opening->closing line movement, if available)
  # are fed to the meta-learner so it learns only the residual the market has
  # not priced. Set false to fall back to a pure statistical model.
  use_market_features: true

  # Feature engineering
  form_window: 5            # Rolling matches for form features
  h2h_lookback: 5           # Past meetings for head-to-head feature
  congestion_days: 8        # "3 matches in N days" congestion window
  load_days: 14             # Cumulative-load (matches in N days) window
  position_reset_days: 100  # Standings reset when dates gap exceeds N days (new season)

  # Staking (covariance-adjusted fractional Kelly)
  kelly_fraction: 0.25      # Fraction of Kelly to stake (conservative)
  kelly_max_stake: 0.10     # Per-bet cap as a fraction of bankroll
  kelly_cov_shrinkage: 0.9  # Weight on the structural covariance (vs empirical)
  kelly_corr: 0.0           # Structural cross-match correlation (calibrated from 0.05)

data:
  allowed_leagues:
    - EPL
    - LALIGA
    - SERIEA
  data_dir: data/raw
  cache_dir: models

backtest:
  min_train_matches: 380    # ~one EPL season
  step_matches: 190         # ~half-season steps

split:
  train_ratio: 0.60         # Chronological train fraction
  val_ratio: 0.15           # Validation fraction
  test_ratio: 0.25          # Test fraction
  n_cv_windows: 5           # Walk-forward cross-validation windows
  min_train_frac: 0.40      # Minimum fraction of data in first CV training window

logging:
  level: INFO               # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: null                # Set to a path like "logs/predictor.log" to enable file logging