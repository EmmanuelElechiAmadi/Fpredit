# Canonical team-name map.
#
# Every source spelling maps to ONE canonical name per league. The canonical
# names are the football-data.co.uk spellings used across src/* (data_loader,
# elo, dixon_coles, features, xg_loader), so results/xG/fixtures all join on
# the same key.
#
# An UNMAPPED team name halts that league's update and is logged for a manual
# fix (the model never guesses). Names that already equal a canonical value are
# accepted automatically, so identity entries below are for documentation only.

