name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: pre-commit run --all-files || true  # don't fail on pre-commit issues

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: pip install -e ".[dev]"
      - name: Run fast tests (excludes slow Dixon-Coles optimization)
        run: python -m pytest tests/ -v --timeout=120 -k "not dixon_coles"
      - name: Run full test suite
        run: python -m pytest tests/ -v --timeout=300 --runslow