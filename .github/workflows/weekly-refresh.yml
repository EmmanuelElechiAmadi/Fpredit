name: Weekly data refresh

# Runs the one-command refresh (scripts/refresh_data.py) on a schedule and
# commits any changed data back to master so the deployed app serves fresh
# results, odds, standings and pruned fixtures without manual pasting.
#
# - Results + odds are re-downloaded from football-data.co.uk weekly.
# - If FOOTBALL_DATA_ORG_API_KEY is set (repository secret), standings +
#   scheduled fixtures + finished results are also pulled from the API.
# - Failed downloads make the job fail loudly (--strict) so you notice.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {} # allow a manual "Run workflow" button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      - name: Refresh data
        env:
          FOOTBALL_DATA_ORG_API_KEY: ${{ secrets.FOOTBALL_DATA_ORG_API_KEY }}
        run: python3 scripts/refresh_data.py --seasons 1 --strict

      - name: Commit refreshed data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || {
            git commit -m "chore: weekly data refresh [skip ci]"
            git push origin HEAD:master
          }
          echo "No data changes to commit (or committed above)."
